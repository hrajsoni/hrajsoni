<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430">
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 8px rgba(255, 26, 43, 0.4)); }
      50% { opacity: 0.9; filter: drop-shadow(0 0 20px rgba(255, 26, 43, 0.8)); }
    }
    @keyframes hudFade {
      0% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes radarSweep {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 360; }
    }
    .bat-badge {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .hud-line {
      animation: hudFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }
    .static-mode {
      opacity: 1 !important;
      animation: none !important;
    }
    .mono {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace;
    }
    .hud-title {
      font-size: 11px;
      fill: #8b949e;
      letter-spacing: 1px;
    }
    .section-tag {
      font-size: 10.5px;
      fill: #ff1a2b;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .field-key {
      font-size: 11px;
      fill: #8b949e;
      font-weight: 600;
    }
    .field-val {
      font-size: 11px;
      fill: #e6edf3;
      font-weight: 500;
    }
    .field-accent {
      font-size: 11px;
      fill: #ff3b4b;
      font-weight: 700;
    }
    .body-txt {
      font-size: 11px;
      fill: #c9d1d9;
      line-height: 1.5;
    }
    .subtext {
      font-size: 9.5px;
      fill: #7d8590;
      letter-spacing: 0.8px;
    }
    .crosshair {
      stroke: #7f1d1d;
      stroke-width: 1;
    }
  </style>
